# Django(Gunicorn)の8000番ポートとつなぐ
upstream django {
    # サーバにDjangoのコンテナ名を指定。今回はweb
    # ポートはDjangoのコンテナの8000番ポート
    server web:8000;
}

server {
    # HTTPの80番ポートを指定
    listen 80;
    server_name 0.0.0.0;

    # シナリオ作成の画像アップロード（2MBまで）が通るように、上限を少し大きめにする（初期値は1MB）
    client_max_body_size 3m;

    # プロキシ設定
    # 実際はNginxのコンテナにアクセスしてるのをDjangoにアクセスしてるかのようにみせる
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
    
    # djangoの静的ファイル(HTML、CSS、Javascriptなど)を管理
    location /static/ {
		alias /static/;
	}

    # アップロードされたキャラクター画像（DEBUG=False では Django が配信しないため nginx で配信する）
    location /media/ {
		alias /media/;
	}
}
